<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>今日校园</title>
  <style>
    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .app-container {
      width: 100%;
      max-width: 414px;
      min-height: 100vh;
      background: #f5f5f5;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== Status Bar ===== */
    .status-bar {
      background: #4A8FE0;
      color: #fff;
      padding: 8px 16px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
    }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons span { font-size: 11px; }

    /* ===== Top Nav ===== */
    .top-nav {
      background: #4A8FE0;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 10px;
    }
    .top-nav .nav-icon {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer;
    }
    .top-nav .nav-title {
      font-size: 18px; font-weight: 600; letter-spacing: 2px;
    }
    .top-nav .scan-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
      transition: background 0.2s;
    }
    .top-nav .scan-icon:active { background: rgba(255,255,255,0.4); }

    /* ===== Banner ===== */
    .banner-wrap {
      background: #4A8FE0;
      padding: 0 16px 16px;
      position: relative;
    }
    .banner-img {
      width: 100%; height: 140px;
      background: linear-gradient(180deg, #5BA0E8 0%, #7EC8E3 30%, #B8D98A 70%, #8BC34A 100%);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 12px 16px;
    }
    .banner-img::before {
      content: '';
      position: absolute; top: 10%; left: 20%;
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
    }
    .banner-img::after {
      content: '';
      position: absolute; top: 20%; right: 30%;
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    .banner-text {
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
      letter-spacing: 3px;
    }

    /* ===== Bottom Curve (banner to white transition) ===== */
    .banner-bottom {
      background: #4A8FE0;
      height: 16px;
      border-radius: 0 0 20px 20px;
      margin: 0 0 -8px;
      position: relative;
      z-index: 0;
    }

    /* ===== Search ===== */
    .search-wrap {
      background: #fff;
      margin: 0 16px;
      border-radius: 22px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
      z-index: 2;
    }
    .search-wrap .search-icon { font-size: 16px; opacity: 0.5; }
    .search-wrap .search-text { font-size: 14px; color: #999; }

    /* ===== Section ===== */
    .section {
      background: #fff;
      margin: 12px 16px;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title::before {
      content: '';
      width: 3px; height: 16px;
      background: #4A8FE0;
      border-radius: 2px;
    }
    .section-more {
      font-size: 12px;
      color: #999;
      cursor: pointer;
    }

    /* ===== Service Grid ===== */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 8px;
    }
    .service-grid.col5 { grid-template-columns: repeat(5, 1fr); }
    .service-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .service-item .s-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .service-item .s-label {
      font-size: 12px;
      color: #333;
      text-align: center;
      white-space: nowrap;
    }
    .s-icon.blue { background: #E8F0FE; }
    .s-icon.orange { background: #FFF3E0; }
    .s-icon.green { background: #E8F5E9; }
    .s-icon.purple { background: #F3E5F5; }
    .s-icon.teal { background: #E0F2F1; }
    .s-icon.pink { background: #FCE4EC; }
    .s-icon.indigo { background: #E8EAF6; }

    /* ===== Bottom Nav ===== */
    .bottom-nav {
      position: sticky;
      bottom: 0;
      background: #fff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 12px;
      border-top: 1px solid #eee;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
    }
    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      color: #999;
      cursor: pointer;
    }
    .bottom-nav .nav-item.active { color: #4A8FE0; }
    .bottom-nav .nav-item .nav-emoji { font-size: 22px; }

    /* ===== Scan Overlay — full screen image ===== */
    .scan-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      z-index: 100;
    }
    .scan-overlay.show { display: block; }

    /* Full screen image container */
    .scan-img-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .scan-img-container img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Close button */
    .scan-close {
      position: absolute;
      top: 12px; left: 12px;
      width: 36px; height: 36px;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      line-height: 1;
    }
    .scan-close:active { background: rgba(0,0,0,0.6); }

    /* Dynamic time — positioned by JS relative to actual image bounds */
    .scan-img-time {
      position: absolute;
      top: 0;
      left: 0;
      text-align: center;
      color: #FDFCFE;
      font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      pointer-events: auto;
      background: transparent;
      white-space: nowrap;
      visibility: hidden;
    }
    .scan-img-time .time-date {
      font-size: 13px;
      letter-spacing: 1.3px;
      vertical-align: baseline;
    }
    .scan-img-time .time-dash {
      font-weight: 600;
      letter-spacing: 0;
    }
    .scan-img-time .time-clock {
      font-size: 17px;
      letter-spacing: 0.3px;
      vertical-align: baseline;
    }

    /* Tips below card */
    .scan-tips {
      text-align: center;
      margin: 18px 16px;
      font-size: 12px;
      color: #AAA;
    }

    /* ===== Click hint on home ===== */
    .scan-hint {
      position: absolute;
      top: 74px;
      right: 22px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 10px;
      pointer-events: none;
      animation: hintPulse 2s ease-in-out infinite;
      white-space: nowrap;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

<div class="app-container" id="appContainer">

  <!-- ========== HOME SCREEN ========== -->
  <div id="homeScreen">
    <div style="position:relative;width:100%;">
      <img src="home.png" alt="今日校园" style="width:100%;display:block;">
      <div id="scanBtn" style="position:absolute;top:10%;right:2%;width:44px;height:44px;cursor:pointer;z-index:10;"></div>
    </div>
  </div><!-- /homeScreen -->

</div><!-- /appContainer -->

<!-- ========== SCAN RESULT — FULL SCREEN IMAGE ========== -->
<div class="scan-overlay" id="scanOverlay">
  <div class="scan-img-container" id="scanImgContainer">
    <img src="scan-result.png" alt="校园码" id="scanImg">
    <div class="scan-close" id="scanClose">✕</div>
    <div class="scan-img-time" id="scanTime">
      <span class="time-date"><span id="scanYear">2026</span><span class="time-dash">-</span><span id="scanMonth">5</span><span class="time-dash">-</span><span id="scanDay">30</span></span> <span class="time-clock" id="scanClock">12:00:00</span>
    </div>
  </div>
</div>

<script>
  // ===== Live time in status bar =====
  function updateStatusTime() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var el = document.getElementById('statusTime');
    if (!el) return;
    el.textContent = h + ':' + m;
  }
  updateStatusTime();
  setInterval(updateStatusTime, 30000);

  // ===== Live time — split date (small) + clock (2x large) =====
  var scanTimer = null;
  function updateScanTime() {
    var now = new Date();
    var y = now.getFullYear();
    var mo = now.getMonth() + 1;
    var d = now.getDate();
    var h = String(now.getHours()).padStart(2, '0');
    var mi = String(now.getMinutes()).padStart(2, '0');
    var s = String(now.getSeconds()).padStart(2, '0');
    var yEl = document.getElementById('scanYear');
    var mEl = document.getElementById('scanMonth');
    var dEl = document.getElementById('scanDay');
    var clockEl = document.getElementById('scanClock');
    if (yEl) yEl.textContent = y;
    if (mEl) mEl.textContent = mo;
    if (dEl) dEl.textContent = d;
    if (clockEl) clockEl.textContent = h + ':' + mi + ':' + s;
  }
  // ===== Drag & pinch state =====
  var timeDrag = { on: false, sx: 0, sy: 0, sl: 0, st: 0 };
  var timeScale = 1;
  var timePinch = { on: false, sd: 0, ss: 1 };

  // ===== Reposition time to match image actual bounds =====
  function repositionScanTime() {
    var img = document.getElementById("scanImg");
    var timeEl = document.getElementById("scanTime");
    var container = document.getElementById("scanImgContainer");
    if (!img || !timeEl || !container) return;
    var imgRect = img.getBoundingClientRect();
    var ctRect = container.getBoundingClientRect();
    var topPx = (imgRect.top - ctRect.top) + imgRect.height * 0.294;
    var leftPx = (imgRect.left - ctRect.left) + imgRect.width * 0.58;
    timeEl.style.top = topPx + "px";
    timeEl.style.left = leftPx + "px";
    timeEl.style.transform = "translateX(-50%) scale(" + timeScale + ")";
    timeEl.style.visibility = "visible";
  }

  // ===== Make time draggable + pinch-zoomable =====
  (function() {
    var el = document.getElementById("scanTime");
    var ct = document.getElementById("scanImgContainer");
    if (!el || !ct) return;

    function updateTransform() {
      el.style.transform = "translateX(-50%) scale(" + timeScale + ")";
    }

    // Mouse drag on time element
    el.addEventListener("mousedown", function(e) {
      e.preventDefault();
      timeDrag.on = true;
      timeDrag.sx = e.clientX; timeDrag.sy = e.clientY;
      timeDrag.sl = parseFloat(el.style.left) || 0;
      timeDrag.st = parseFloat(el.style.top) || 0;
    });
    document.addEventListener("mousemove", function(e) {
      if (!timeDrag.on) return;
      el.style.left = (timeDrag.sl + e.clientX - timeDrag.sx) + "px";
      el.style.top = (timeDrag.st + e.clientY - timeDrag.sy) + "px";
    });
    document.addEventListener("mouseup", function() { timeDrag.on = false; });

    // Touch: drag on time element, pinch on container (larger area)
    el.addEventListener("touchstart", function(e) {
      if (e.touches.length === 1) {
        timeDrag.on = true; timePinch.on = false;
        timeDrag.sx = e.touches[0].clientX; timeDrag.sy = e.touches[0].clientY;
        timeDrag.sl = parseFloat(el.style.left) || 0;
        timeDrag.st = parseFloat(el.style.top) || 0;
      }
    }, {passive: false});

    ct.addEventListener("touchstart", function(e) {
      if (e.touches.length === 2) {
        timeDrag.on = false; timePinch.on = true;
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        timePinch.sd = Math.sqrt(dx*dx + dy*dy);
        timePinch.ss = timeScale;
      }
    }, {passive: false});

    document.addEventListener("touchmove", function(e) {
      if (timeDrag.on && e.touches.length === 1) {
        e.preventDefault();
        el.style.left = (timeDrag.sl + e.touches[0].clientX - timeDrag.sx) + "px";
        el.style.top = (timeDrag.st + e.touches[0].clientY - timeDrag.sy) + "px";
      } else if (timePinch.on && e.touches.length === 2) {
        e.preventDefault();
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx*dx + dy*dy);
        timeScale = Math.max(0.2, Math.min(5, timePinch.ss * (dist / timePinch.sd)));
        updateTransform();
      }
    }, {passive: false});
    document.addEventListener("touchend", function(e) {
      timeDrag.on = false;
      if (e.touches.length < 2) timePinch.on = false;
    });
  })();

  // ===== Scan button → show full screen image =====
  var scanOverlay = document.getElementById('scanOverlay');
  document.getElementById('scanBtn').addEventListener('click', function() {
    updateScanTime();
    if (scanTimer) clearInterval(scanTimer);
    scanTimer = setInterval(updateScanTime, 1000);
    scanOverlay.classList.add("show");
    requestAnimationFrame(function() {
      requestAnimationFrame(repositionScanTime);
    });
  });
// ===== Close button → hide =====
  document.getElementById('scanClose').addEventListener('click', function(e) {
    e.stopPropagation();
    scanOverlay.classList.remove('show');
    document.getElementById('scanTime').style.visibility = 'hidden';
  });

  // ===== Click image → hide =====
  document.getElementById('scanImg').addEventListener('click', function() {
    scanOverlay.classList.remove('show');
    document.getElementById('scanTime').style.visibility = 'hidden';
  });

  // ===== All other interactive elements → no-op =====
  document.querySelectorAll('.service-item, .nav-item, .section-more, .search-wrap').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
    });
  });
  // ===== Reposition on resize (e.g. phone rotate) =====
  window.addEventListener("resize", function() {
    if (scanOverlay.classList.contains("show")) repositionScanTime();
  });
</script>

</body>
</html>
